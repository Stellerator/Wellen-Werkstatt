<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wellen-Werkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: iPad-Querformat zuerst.
   Lernpfad (Startseite) → Fokus-Karten (Steckbriefe mit Mini-Check) → Challenge (Level-Auswahl) → Level (Bild links, Bedienung rechts). */
:root{
  --bg:#eef3f6; --surface:#ffffff; --plot:#fbfdfe; --grid:#e1e9ef; --line:#cfdae2;
  --ink:#122029; --muted:#566874;
  --wave:#1d5bbd; --on-wave:#ffffff; --mark:#d97f00; --mark-soft:#fdf0dc;
  --ok:#1d8048; --ok-soft:#e3f4ea; --bad:#c2352a; --bad-soft:#fbe7e5;
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e151b; --surface:#16212a; --plot:#121b22; --grid:#1d2a34; --line:#2a3945;
  --ink:#e4ecf1; --muted:#93a5b2;
  --wave:#6fa6ff; --on-wave:#0b1622; --mark:#ffb13d; --mark-soft:#3a2a12;
  --ok:#50c784; --ok-soft:#14321f; --bad:#ff6d60; --bad-soft:#3a1714; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#16212a; --plot:#121b22; --grid:#1d2a34; --line:#2a3945;
  --ink:#e4ecf1; --muted:#93a5b2;
  --wave:#6fa6ff; --on-wave:#0b1622; --mark:#ffb13d; --mark-soft:#3a2a12;
  --ok:#50c784; --ok-soft:#14321f; --bad:#ff6d60; --bad-soft:#3a1714; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.5 var(--font-body);-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
#app{min-height:100dvh;display:flex;flex-direction:column;max-width:1400px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(20px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

/* Kopf der Startseite */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
.logo{flex:none;border:0;background:none;padding:0;border-radius:12px;line-height:0}
.brand h1{font-size:clamp(28px,3.4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1}
.brand p{margin-top:4px;color:var(--muted);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tab{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.tab .nr{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-pressed="true"] .nr{color:inherit;opacity:.7}
.tab:disabled{opacity:.5;cursor:not-allowed}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.theme button{min-height:40px;min-width:44px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar .theme{margin-left:auto}
.teacher{min-height:40px;background:var(--mark-soft);color:var(--mark);border:1px solid var(--mark);border-radius:999px;padding:0 14px;font-size:14px;font-weight:700}

/* Lernpfad */
.home{display:flex;flex-direction:column;gap:20px}
.khead h2{font-size:clamp(26px,3vw,34px);font-weight:800}
.khead p{color:var(--muted)}
.path{display:flex;align-items:stretch}
.station{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;min-height:228px;position:relative}
.station .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:18px;border:2px solid var(--line);background:var(--plot)}
.station h3{font-size:22px;font-weight:800;line-height:1.15}
.station p{color:var(--muted);font-size:15px;flex:1}
.station .stat{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;min-height:22px}
.station.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.station.next{border-color:var(--wave);box-shadow:0 0 0 5px color-mix(in srgb,var(--wave) 16%,transparent)}
.station.next .num{background:var(--wave);border-color:var(--wave);color:var(--on-wave)}
.station.locked{background:transparent;border-style:dashed;color:var(--muted);cursor:default}
.station.locked h3{color:var(--muted)}
.badge-next{position:absolute;top:-13px;right:14px;background:var(--wave);color:var(--on-wave);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 11px;border-radius:999px}
.conn{flex:0 0 34px;display:grid;place-items:center;color:var(--muted);pointer-events:none}
.dots{display:inline-flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.cta-row{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap}
.cta-note{color:var(--muted);font-size:15px;min-height:22px}
.cta-note.warn{color:var(--mark);font-weight:700}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px;color:var(--muted)}
.rule b{color:var(--ink);display:block;font-size:16px}
.locked-k{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);text-align:center}
footer{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-family:var(--font-mono)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 12px;font-size:13px;color:var(--muted);font-family:var(--font-mono)}
.linkbtn.arm{border-color:var(--bad);color:var(--bad)}

/* Kopfzeile in Unteransichten */
.bar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-bottom:14px}
.bar .ttl{flex:1;min-width:220px}
.bar h2{font-size:clamp(22px,2.6vw,30px);font-weight:800;line-height:1.1}
.back{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.score{font-family:var(--font-mono);font-weight:700;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-variant-numeric:tabular-nums}
.track{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.track i{width:36px;height:14px;border-radius:7px;background:var(--line)}
.track i.ok{background:var(--ok)}
.track i.bad{background:var(--mark)}
.track i.cur{outline:2px solid var(--ink);outline-offset:2px}
.track span{font-size:14px;color:var(--muted);font-weight:700;margin-left:6px}
.track span.warn{color:var(--mark)}

/* Fokus-Karten */
.fstage{flex:1;display:flex;flex-direction:column;min-height:0}
.fcard{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:26px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;min-height:0}
.fcard.inR{animation:inR .28s ease-out} .fcard.inL{animation:inL .28s ease-out}
@keyframes inR{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
.ftext{display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
.ftext h3{font-size:clamp(28px,3.2vw,38px);font-weight:800;line-height:1.1}
.ftext p{font-size:19px}
.formel{font-family:var(--font-mono);font-weight:700;font-size:20px;background:var(--plot);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;align-self:flex-start}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:inline-block;padding:2px 9px;border-radius:6px;margin-bottom:4px}
.merke,.falle{font-size:17px!important;border-radius:14px;padding:12px 14px}
.merke{background:var(--ok-soft)} .merke .tag{background:var(--ok);color:#fff}
.falle{background:var(--mark-soft)} .falle .tag{background:var(--mark);color:#fff}
.fside{display:flex;flex-direction:column;gap:12px;min-height:0}
.check{border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--plot);display:flex;flex-direction:column;gap:10px}
.check.solved{border-color:var(--ok)}
.check .q{font-weight:700;font-size:17px}
.check .opts{display:grid;gap:8px}
.check .opts button{min-height:52px;text-align:left;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.fnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.fmid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.fdots{display:flex;gap:2px}
.fdots button{width:34px;height:34px;padding:0;border:0;background:none;display:grid;place-items:center}
.fdots button::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent}
.fdots button.done::after{background:var(--ok);border-color:var(--ok)}
.fdots button.cur::after{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 20%,transparent)}
.fhint{font-size:14px;color:var(--muted);text-align:center}

/* Challenge-Start */
.intro{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;min-height:0;align-items:start}
.about{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px}
.about h3{font-size:30px;font-weight:800}
.levels{display:flex;flex-direction:column;gap:12px}
.level{display:grid;grid-template-columns:60px minmax(0,1fr) auto;align-items:center;gap:16px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;text-align:left;min-height:96px}
.level .lnum{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:26px;background:var(--plot);border:2px solid var(--line)}
.level h3{font-size:21px;font-weight:800}
.level p{color:var(--muted);font-size:15px}
.level .go{font-weight:700;color:var(--wave);white-space:nowrap}
.level.passed .lnum{background:var(--ok);color:#fff;border-color:var(--ok)}
.level.next{border-color:var(--wave)}
.level.next .lnum{background:var(--wave);color:var(--on-wave);border-color:var(--wave)}
.level.locked{border-style:dashed;background:transparent;cursor:default}
.level.locked h3,.level.locked .go{color:var(--muted)}

/* Spielansicht */
.split{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(380px,1fr);gap:16px;min-height:0}
.viz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pred{display:inline-flex;align-items:center;background:var(--mark-soft);color:var(--mark);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.prompt{font-size:20px;font-weight:700;line-height:1.35}
.hint{color:var(--muted);font-size:15px}
.pbody{display:flex;flex-direction:column;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:4px}
.cv{position:relative;flex:1 1 0;min-height:150px;min-width:0}
.cv canvas{position:absolute;left:0;top:0;display:block;border-radius:12px;border:1px solid var(--line);touch-action:manipulation}
.cv.small{flex:.75 1 0;min-height:130px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.situ{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:12px 22px}
.situ p{font-family:var(--font-display);font-size:clamp(22px,2.5vw,30px);font-weight:600;line-height:1.3;text-wrap:pretty}
.phen{border:2px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--plot)}
.phen h3{font-size:clamp(24px,2.8vw,32px);font-weight:800}
.phen p{color:var(--muted);margin-top:4px}

.btn{min-height:54px;padding:0 24px;border-radius:14px;border:0;background:var(--wave);color:var(--on-wave);font-weight:700;font-size:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.big{min-height:62px;font-size:20px;padding:0 30px}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers.col{grid-template-columns:1fr}
.answers button{min-height:62px;border-radius:14px;border:2px solid var(--line);background:var(--plot);font-weight:700;font-size:17px;padding:10px 14px;text-align:left;line-height:1.3}
.answers button small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.answers button.right,.check .opts button.right{border-color:var(--ok);background:var(--ok-soft)}
.answers button.wrong,.check .opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answers.done button:not(.right):not(.wrong){opacity:.5}
.answers.graphs button{padding:8px;display:flex;flex-direction:column;gap:6px}
.answers.graphs .mini{position:relative;height:108px;width:100%}
.answers.graphs .mini canvas{position:absolute;left:0;top:0;border-radius:8px}
.answers.graphs .gl{font-family:var(--font-mono);font-size:14px}

.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:4px 6px 4px 12px;border-radius:12px;border:1px solid var(--line);background:var(--plot)}
.row .sym{font-family:var(--font-mono);font-weight:700;font-size:21px;margin-right:8px}
.row .nm{color:var(--muted);font-size:14px}
.tri{display:flex;gap:6px}
.tri button{width:58px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:21px;font-weight:700;font-family:var(--font-mono)}
.tri button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row.ok{border-color:var(--ok);background:var(--ok-soft)}
.row.bad{border-color:var(--bad);background:var(--bad-soft)}
.row .fix{display:block;font-size:13px;font-weight:700;color:var(--bad)}

.feedback{border-radius:14px;padding:12px 15px;font-size:16px}
.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.feedback.info{background:var(--mark-soft);border:1px solid var(--mark)}
.feedback b{display:block;margin-bottom:2px}

.controls{display:grid;gap:14px}
.ctl-lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--plot);font-weight:700;line-height:1.15}
.seg button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.75}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.freq{display:flex;align-items:center;gap:10px}
.freq input{flex:1;min-width:0;accent-color:var(--wave);height:36px}
.freq .val{font-family:var(--font-mono);font-weight:700;min-width:100px;text-align:right;font-variant-numeric:tabular-nums}
.step{width:50px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--plot);font-weight:700;font-size:24px}
.step:disabled,.freq input:disabled{opacity:.45}
.predict{border:2px solid var(--mark);border-radius:16px;padding:14px;background:var(--mark-soft);display:flex;flex-direction:column;gap:10px}
.predict .q{font-weight:700}
.predict .seg button{background:var(--surface)}

.endcard{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.endcard .big{font-family:var(--font-display);font-weight:800;font-size:76px;line-height:1;font-variant-numeric:tabular-nums}
.endcard h3{font-size:30px;font-weight:800}
.endcard .msg{max-width:560px;color:var(--muted)}
.unlock{background:var(--ok-soft);border:1px solid var(--ok);border-radius:999px;padding:6px 16px;font-weight:700}

/* iPad quer und große Bildschirme: alles in einen Bildschirm, kein Scrollen */
@media (min-width:900px) and (min-aspect-ratio:5/4) and (min-height:560px){
  #app.fill{height:100dvh;overflow:hidden}
}
/* Hochformat und schmale Bildschirme: untereinander, normal scrollen */
@media (max-width:899px), (max-aspect-ratio:5/4), (max-height:559px){
  .split{grid-template-columns:1fr}
  .cv{flex:none;height:260px}
  .cv.small{height:190px}
  .fcard{grid-template-columns:1fr}
  .fside .cv{height:240px}
  .intro{grid-template-columns:1fr}
  .panel{overflow:visible}
}
@media (max-width:820px), (orientation:portrait){
  .path{flex-direction:column}
  .conn{flex:0 0 28px;transform:rotate(90deg)}
  .station{flex:none;min-height:0;display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:14px;row-gap:4px;align-items:start}
  .station .num{grid-row:1/span 4}
  .station .eyebrow,.station h3,.station p,.station .stat{grid-column:2}
}
@media (max-width:520px){ .tri button{width:50px} .answers{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .fcard{animation:none!important} }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   INHALTE — hier erweitern.
   Ein Kapitel: Steckbriefe (Karten mit Mini-Check) und Challenges (je 3 Levels).
   Freischalten: Kapitel über freigegeben:true.
   ===================================================================== */

const STECKBRIEFE = {
  welle:{titel:"Mechanische Welle", viz:"welle",
    text:"Eine mechanische Welle ist die Ausbreitung einer Schwingung im Raum. Gekoppelte Oszillatoren geben ihre Schwingung an den Nachbarn weiter. Alle Oszillatoren zusammen bilden das Medium.",
    merke:"Eine Welle transportiert Energie, aber keine Materie.",
    falle:"Die Teilchen wandern nicht mit der Welle. Jedes schwingt nur um seine eigene Ruhelage.",
    check:{q:"Eine Welle läuft über einen See. Was macht ein Blatt, das auf dem Wasser liegt?",
      o:["Es schaukelt, bleibt aber im Mittel an seinem Platz.","Es wird mit der Welle bis zum Ufer getragen.","Es bleibt völlig ruhig liegen."],
      h:"Beobachte das orange Teilchen in der Animation.",

const app = document.getElementById("app");
let cleanups = [];
function cleanup(){ cleanups.splice(0).forEach(fn=>{try{fn()}catch(e){}}); }
function loop(fn){ let alive=true, id; const t0=performance.now();
  const step=now=>{ if(!alive) return; try{ fn((now-t0)/1000); }catch(e){ console.error(e); alive=false; return; } id=requestAnimationFrame(step); };
  id=requestAnimationFrame(step); const stop=()=>{alive=false;cancelAnimationFrame(id)}; cleanups.push(stop); return stop; }
function el(tag, attrs={}, html){ const e=document.createElement(tag);
  for(const k in attrs){ if(k==="class") e.className=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); }
  if(html!==undefined) e.innerHTML=html; return e; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
const pick=(a,n)=>shuffle(a).slice(0,n);
const rand=n=>Math.floor(Math.random()*n);
const one=a=>a[rand(a.length)];
const nf = v => Number(v).toLocaleString("de-DE",{maximumSignificantDigits:3});
const nfs = v => Number(v.toFixed(3)).toLocaleString("de-DE",{maximumFractionDigits:3});
const fmt = v => String(v).replace(".",",");
const TAU = Math.PI*2;
const MONO = (w,s=13) => `${w} ${s}px "JetBrains Mono", ui-monospace, monospace`;
function colors(){ const s=getComputedStyle(document.documentElement); const g=n=>s.getPropertyValue(n).trim();
  return {ink:g("--ink"),muted:g("--muted"),grid:g("--grid"),line:g("--line"),plot:g("--plot"),surface:g("--surface"),wave:g("--wave"),mark:g("--mark"),ok:g("--ok"),bad:g("--bad")}; }

function mkcv(parent,cls=""){ const c=el("div",{class:"cv "+cls}); parent.appendChild(c); return c; }
function canvasFill(host){
  const c=el("canvas"); host.appendChild(c); const ctx=c.getContext("2d"); const st={c,ctx,w:0,h:0};
  const fit=()=>{ const w=Math.max(160,host.clientWidth), h=Math.max(90,host.clientHeight); const d=window.devicePixelRatio||1;
    c.width=Math.round(w*d); c.height=Math.round(h*d); c.style.width=w+"px"; c.style.height=h+"px"; ctx.setTransform(d,0,0,d,0,0); st.w=w; st.h=h; };
  fit(); const ro=new ResizeObserver(fit); ro.observe(host); cleanups.push(()=>ro.disconnect()); return st; }
function paper(st,col){ const {ctx,w,h}=st; ctx.fillStyle=col.plot; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle=col.grid; ctx.lineWidth=1; ctx.beginPath();
  for(let x=0.5;x<w;x+=20){ctx.moveTo(x,0);ctx.lineTo(x,h)} for(let y=0.5;y<h;y+=20){ctx.moveTo(0,y);ctx.lineTo(w,y)} ctx.stroke(); }
function arrow(ctx,x1,y1,x2,y2,col,lw=2){ ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1), s=9; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-s*Math.cos(a-0.45),y2-s*Math.sin(a-0.45)); ctx.lineTo(x2-s*Math.cos(a+0.45),y2-s*Math.sin(a+0.45)); ctx.closePath(); ctx.fill(); }
function darrow(ctx,x1,y1,x2,y2,col,lw=2){ arrow(ctx,x1,y1,x2,y2,col,lw); arrow(ctx,x2,y2,x1,y1,col,lw); }
function label(ctx,txt,x,y,col,align="left",weight=500,size=13){ ctx.fillStyle=col; ctx.font=MONO(weight,size); ctx.textAlign=align; ctx.fillText(txt,x,y); ctx.textAlign="left"; }
function curve(ctx,x0,x1,fy,col,lw=3,step=2){ ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineJoin="round"; ctx.lineCap="round"; ctx.beginPath();
  for(let x=x0;x<=x1+0.01;x+=step){ const y=fy(x); x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); }
function dashV(ctx,x,y1,y2,col){ ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x,y2); ctx.stroke(); ctx.setLineDash([]); }

// Teilchenkette: quer, laengs oder misch (Kreisbahnen)
function drawChain(st,col,t,mode,opt={}){
  const {ctx,w,h}=st; paper(st,col);
  const N=Math.max(14,Math.min(34,Math.floor(w/28))); const x0=28, dx=(w-56)/(N-1);
  const lam=(w-56)/2.2, f=0.5, mi=Math.floor(N/3), y0=h/2+12, A=Math.min(48,h*0.27);
  label(ctx,opt.label||"Ausbreitung",w-26,22,col.muted,"right"); arrow(ctx,w-160,34,w-26,34,col.muted);
  const pts=[];
  for(let i=0;i<N;i++){ const xr=x0+i*dx; const phi=TAU*(f*t-(xr-x0)/lam); const sv=Math.sin(phi), cv=Math.cos(phi);
    if(mode==="quer") pts.push([xr,y0-A*sv]);
    else if(mode==="laengs") pts.push([xr+dx*0.42*sv,y0]);
    else { const r=Math.min(A*0.62,dx*0.9); pts.push([xr-r*cv,y0-r*sv]); } }
  if(mode!=="laengs"){ ctx.strokeStyle=col.line; ctx.lineWidth=2; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); }
  const rx=x0+mi*dx; ctx.strokeStyle=col.mark; ctx.lineWidth=1.5; ctx.setLineDash([3,4]); ctx.beginPath();
  if(mode==="quer"){ctx.moveTo(rx,y0-A-6);ctx.lineTo(rx,y0+A+6)}
  else if(mode==="laengs"){ctx.moveTo(rx-dx*0.5,y0+22);ctx.lineTo(rx+dx*0.5,y0+22)}
  else { const r=Math.min(A*0.62,dx*0.9); ctx.arc(rx,y0,r,0,TAU); }
  ctx.stroke(); ctx.setLineDash([]);
  pts.forEach((p,i)=>{ ctx.beginPath(); ctx.fillStyle=i===mi?col.mark:col.wave; ctx.arc(p[0],p[1],i===mi?8:5.5,0,TAU); ctx.fill(); });
}

// Diagramm mit Achsen und Skala (für Ablesen)
function axesPlot(st,col,o){
  const {ctx,w,h}=st; ctx.fillStyle=col.plot; ctx.fillRect(0,0,w,h);
  const L=58,R=20,T=o.title?30:18,B=34, pw=w-L-R, ph=h-T-B;
  const X=x=>L+x/o.xmax*pw, Y=y=>T+ph/2-y/o.ymax*ph/2;
  ctx.strokeStyle=col.grid; ctx.lineWidth=1; ctx.beginPath();
  for(let x=0;x<=o.xmax+1e-9;x+=o.xminor){const px=Math.round(X(x))+.5; ctx.moveTo(px,T); ctx.lineTo(px,T+ph);}
  for(let y=-o.ymax;y<=o.ymax+1e-9;y+=o.ystep){const py=Math.round(Y(y))+.5; ctx.moveTo(L,py); ctx.lineTo(L+pw,py);}
  ctx.stroke();
  ctx.strokeStyle=col.muted; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(L,T); ctx.lineTo(L,T+ph); ctx.moveTo(L,Y(0)); ctx.lineTo(L+pw,Y(0)); ctx.stroke();
  ctx.font=MONO(500,12); ctx.fillStyle=col.muted; ctx.textAlign="center";
  const nx=Math.round(o.xmax/o.xmajor);
  for(let k=0;k<=nx;k++){ const x=k*o.xmajor; ctx.fillText(nfs(x),X(x),T+ph+20); }
  ctx.textAlign="right";
  for(let y=-o.ymax;y<=o.ymax+1e-9;y+=o.ystep){ ctx.fillText(nfs(y),L-8,Y(y)+4); }
  const tag=(txt,x,y,al)=>{ ctx.font=MONO(700,13); const tw=ctx.measureText(txt).width; const x0=al==="right"?x-tw:x;
    ctx.fillStyle=col.plot; ctx.globalAlpha=.88; ctx.fillRect(x0-4,y-13,tw+8,18); ctx.globalAlpha=1; ctx.fillStyle=col.ink; ctx.textAlign="left"; ctx.fillText(txt,x0,y); };
  const drawTags=()=>{ tag(`${o.ylab} in ${o.yunit}`,L+8,T+14,"left"); tag(`${o.xlab} in ${o.xunit}`,L+pw-4,Y(0)-10,"right"); };
  if(o.title){ label(ctx,o.title,L+pw,18,col.muted,"right",700,12); }
  ctx.save(); ctx.beginPath(); ctx.rect(L,T-4,pw,ph+8); ctx.clip();
  curve(ctx,L,L+pw,px=>Y(o.fn((px-L)/pw*o.xmax)),col.wave,3,1.5); ctx.restore(); drawTags();
  if(o.shown && o.mark){ const m=o.mark;
    if(m.type==="h"){ const y=Y(m.y)+(m.y>=0?-14:14); darrow(ctx,X(m.a),y,X(m.b),y,col.mark,2.5);
      dashV(ctx,X(m.a),Y(m.y),y,col.mark); dashV(ctx,X(m.b),Y(m.y),y,col.mark);
      label(ctx,m.label,(X(m.a)+X(m.b))/2,y+(m.y>=0?-8:20),col.mark,"center",700,15); }
    else { darrow(ctx,X(m.x),Y(0),X(m.x),Y(m.y),col.mark,2.5); label(ctx,m.label,X(m.x)+10,(Y(0)+Y(m.y))/2+5,col.mark,"left",700,15); } }
}

// Spalt-Szene in Schrägansicht (Polarisation)
const RICHT = a=>({0:"senkrecht",90:"waagerecht",45:"schräg"})[a]||"schräg";
function slitScene(st,col,t,cfg,live){
  const {ctx,w,h}=st; paper(st,col);
  const L=78, Rm=46, span=w-L-Rm, y0=h*0.48, A=Math.min(54,h*0.16), lam=span/2.3, f=0.45;
  const slits=cfg.slits||[]; const xs=slits.length===1?[L+span*0.5]:[L+span*0.4,L+span*0.72];
  const P3=(x,y,z)=>[x-0.5*z, y0-y+0.45*z];
  const segs=[]; let vec={a:A, ang:cfg.theta||0};
  const bounds=[L,...xs,L+span];
  for(let k=0;k<bounds.length-1;k++){
    segs.push({x0:bounds[k],x1:bounds[k+1],a:vec.a,ang:vec.ang});
    if(k<slits.length && !cfg.long){ const c=Math.cos((vec.ang-slits[k])*Math.PI/180); vec={a:vec.a*c, ang:slits[k]}; }
  }
  // Orientierung
  const ox=26, oy=h-26; arrow(ctx,ox,oy,ox,oy-30,col.muted,1.5); arrow(ctx,ox,oy,ox+0.5*30,oy-0.45*30,col.muted,1.5);
  label(ctx,"senkrecht",ox+6,oy-34,col.muted,"left",500,11); label(ctx,"waagerecht",ox+24,oy-8,col.muted,"left",500,11);
  // Ruhelinie
  ctx.strokeStyle=col.line; ctx.lineWidth=1.5; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.moveTo(L,y0); ctx.lineTo(L+span,y0); ctx.stroke(); ctx.setLineDash([]);
  // Erreger
  if(cfg.long){ darrow(ctx,L-48,y0-34,L-14,y0-34,col.mark,2.5); }
  else { const r=(cfg.theta||0)*Math.PI/180, u=[Math.cos(r),Math.sin(r)];
    const p1=P3(L-26,-A*1.1*u[0],-A*1.1*u[1]), p2=P3(L-26,A*1.1*u[0],A*1.1*u[1]); darrow(ctx,p1[0],p1[1],p2[0],p2[1],col.mark,2.5); }
  label(ctx,"Erreger",L-30,y0-A*1.5,col.muted,"center",700,12);
  const board=(x,al)=>{ const H=A*1.55, W=A*1.55; const cs=[[H,W],[H,-W],[-H,-W],[-H,W]].map(([y,z])=>P3(x,y,z));
    ctx.globalAlpha=.9; ctx.fillStyle=col.line; ctx.beginPath(); cs.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle=col.muted; ctx.lineWidth=1.5; ctx.stroke();
    const r=al*Math.PI/180, u=[Math.cos(r),Math.sin(r)], n=[-Math.sin(r),Math.cos(r)], S=A*1.32, s=A*0.13;
    const sl=[[S,s],[S,-s],[-S,-s],[-S,s]].map(([a,b])=>P3(x,a*u[0]+b*n[0],a*u[1]+b*n[1]));
    ctx.fillStyle=col.plot; ctx.beginPath(); sl.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill(); ctx.strokeStyle=col.muted; ctx.lineWidth=1; ctx.stroke();
    const lp=P3(x,-H,0); label(ctx,`Spalt ${RICHT(al)}`,lp[0],Math.min(h-8,lp[1]+44),col.ink,"center",700,12); };
  // Kurve mit Projektion: curve() nutzt x als Bildschirm-x; für schräge Auslenkung x-Versatz ergänzen
  const drawSegP=sg=>{ if(cfg.long){ const sp=span/42; ctx.fillStyle=col.wave;
      for(let x=Math.ceil((sg.x0-L)/sp)*sp+L; x<sg.x1; x+=sp){ const ph=TAU*(f*t-(x-L)/lam); const dx=live?0.4*sp*Math.sin(ph):0; ctx.beginPath(); ctx.arc(x+dx,y0,4.5,0,TAU); ctx.fill(); }
      return; } const r=sg.ang*Math.PI/180;
    ctx.strokeStyle=col.wave; ctx.lineWidth=3; ctx.lineJoin="round"; ctx.beginPath(); let first=true;
    for(let x=sg.x0;x<=sg.x1+0.01;x+=2){ const d=live?sg.a*Math.sin(TAU*(f*t-(x-L)/lam)):0; const p=P3(x,d*Math.cos(r),d*Math.sin(r)); first?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]); first=false; }
    ctx.stroke();
    if(live && Math.abs(sg.a)<0.5 && sg.x0>L){ label(ctx,"keine Welle",(sg.x0+sg.x1)/2,y0-14,col.bad,"center",700,12); } };
  segs.forEach((sg,k)=>{ drawSegP(sg); if(k<xs.length) board(xs[k],slits[k]); });
}

// Rechen-Level: vier Ergebnisse, drei davon typische Fehler
function zahlenTasks(){
  const gens=[
    ()=>{ const c=one([2,3,4,6,8,12]), f=one([0.5,1,2,4]); const l=c/f;
      return {sit:`Eine Seilwelle läuft mit c = ${nf(c)} m/s. Der Erreger schwingt mit f = ${nf(f)} Hz.`, q:"Wie groß ist die Wellenlänge λ?",
        opts:[{t:`${nf(l)} m`,ok:true},{t:`${nf(c*f)} m`,fb:"Du hast c · f gerechnet. Stell c = λ · f nach λ um."},{t:`${nf(f/c)} m`,fb:"Der Bruch ist umgedreht."},{t:`${nf(2*l)} m`,fb:"Doppelt so groß. Ein Faktor 2 gehört hier nicht hinein."}],
        erkl:`λ = c / f = ${nf(c)} m/s : ${nf(f)} Hz = ${nf(l)} m.`}; },
    ()=>{ const lc=one([20,25,40,50,80]), f=one([2,4,5,10]); const lm=lc/100, c=lm*f;
      return {sit:`Auf einem Gummiseil misst du λ = ${lc} cm. Der Erreger schwingt mit f = ${nf(f)} Hz.`, q:"Wie schnell breitet sich die Welle aus?",
        opts:[{t:`${nf(c)} m/s`,ok:true},{t:`${nf(lc*f)} m/s`,fb:`Die Zentimeter sind nicht in Meter umgerechnet: ${lc} cm = ${nf(lm)} m.`},{t:`${nf(lm/f)} m/s`,fb:"Du hast geteilt. Es gilt c = λ · f."},{t:`${nf(f/lm)} m/s`,fb:"Das ist f / λ. Es gilt c = λ · f."}],
        erkl:`c = λ · f = ${nf(lm)} m · ${nf(f)} Hz = ${nf(c)} m/s.`}; },
    ()=>{ const l=one([0.5,1,1.5,2,3]), Tms=one([100,200,250,500]); const T=Tms/1000, c=l/T;
      return {sit:`Eine Welle hat λ = ${nf(l)} m. Ein Oszillator braucht T = ${Tms} ms für eine Schwingung.`, q:"Wie groß ist c?",
        opts:[{t:`${nf(c)} m/s`,ok:true},{t:`${nf(l/Tms)} m/s`,fb:`Die Millisekunden sind nicht umgerechnet: ${Tms} ms = ${nf(T)} s.`},{t:`${nf(l*T)} m/s`,fb:"c = λ / T, nicht λ · T. In der Zeit T läuft die Welle genau λ weit."},{t:`${nf(T/l)} m/s`,fb:"Der Bruch ist umgedreht."}],
        erkl:`c = λ / T = ${nf(l)} m : ${nf(T)} s = ${nf(c)} m/s.`}; },
    ()=>{ const l=one([0.6,0.9,1.2,1.8,2.4]), k=one([2,3,4,0.5]); const wort=k===0.5?"halb so schnell":k===2?"doppelt so schnell":k===3?"dreimal so schnell":"viermal so schnell";
      return {sit:`Auf einem Seil ist λ = ${nf(l)} m. Der Erreger schwingt jetzt ${wort}. Das Seil bleibt gleich.`, q:"Wie groß ist λ jetzt?",
        opts:[{t:`${nf(l/k)} m`,ok:true},{t:`${nf(l*k)} m`,fb:"Bei gleichem c sind λ und f umgekehrt proportional. Steigt f, sinkt λ."},{t:`${nf(l)} m`,fb:"λ ändert sich, weil c gleich bleibt und f sich ändert."},{t:`${nf(l/(k*k))} m`,fb:"Zu stark. λ ist umgekehrt proportional zu f, nicht zu f²."}],
        erkl:`c bleibt gleich, also gilt λ · f = konstant. Wird f ${k===0.5?"halbiert":"mit "+nf(k)+" multipliziert"}, wird λ ${k===0.5?"verdoppelt":"durch "+nf(k)+" geteilt"}: ${nf(l/k)} m.`}; },
    ()=>{ const f=one([340,425,500,680,850]); const lW=1480/f, lL=340/f;
      return {sit:`Ein Ton mit f = ${f} Hz gelangt aus der Luft (c = 340 m/s) ins Wasser (c = 1480 m/s).`, q:"Wie groß ist λ im Wasser?",

/* ---------- Welches Teilchen bin ich? ---------- */
function teilchenText(R,j){ const v=Math.sin(TAU*j/8+R.phi), dv=-R.dir*Math.cos(TAU*j/8+R.phi);
  const lage=v>0.95?"im Wellenberg":v<-0.95?"im Wellental":Math.abs(v)<0.05?"in der Ruhelage":(v>0?"oberhalb der Ruhelage":"unterhalb der Ruhelage");
  const bew=Math.abs(v)>0.95?(v>0?"nach unten":"nach oben"):(dv>0?"nach oben":"nach unten");
  return {lage,bew,nachbar:R.dir>0?"links":"rechts"}; }
function drawSx(A,col,R,t,K,opt){ // obere Grafik: Teilchen auf der Welle
  const {ctx,w,h}=A; paper(A,col); const L=26,Rr=26, dx=(w-L-Rr)/(K-1); const y0=h/2-8, amp=Math.min(60,h*0.3);
  const s=(i,tt)=>Math.sin(TAU*i/8+R.phi-R.dir*TAU*tt);
  ctx.strokeStyle=col.line; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(10,y0); ctx.lineTo(w-10,y0); ctx.stroke();
  ctx.strokeStyle=col.wave; ctx.globalAlpha=.35; ctx.lineWidth=2; ctx.beginPath();
  for(let q=0;q<=(K-1)*8;q++){ const i=q/8, px=L+i*dx, py=y0-amp*s(i,t); q?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.stroke(); ctx.globalAlpha=1;
  ctx.font=MONO(700); ctx.textAlign="center";
  for(let i=0;i<K;i++){ const px=L+i*dx, py=y0-amp*s(i,t); const hl=opt.hl(i);
    ctx.beginPath(); ctx.fillStyle=hl?col.mark:col.wave; ctx.arc(px,py,hl?9:7,0,TAU); ctx.fill();

function drawSt(B,col,g,opt={}){ // s(t)-Grafik
  const {ctx,w,h}=B; paper(B,col); const l=opt.small?18:34, by=h/2, bamp=Math.min(50,h*0.36), tw=w-l-(opt.small?10:16);

function teilchenTask(R){ return {run(api){

function teilchenRueck(){ return [...Array(PRO_LEVEL)].map(()=>{ const R={dir:Math.random()<0.5?1:-1, phi:rand(8)*TAU/8, j:2+rand(8)};

/* ---------- Ablesen & Rechnen ---------- */
function sxConf(){ const lam=one([1,1.5,2,2.5,3]), sh=one([2,3,4]), sg=Math.random()<.5?1:-1;
  return {lam,sh,sg,o:{xmax:6,xminor:0.25,xmajor:0.5,ymax:sh+1,ystep:1,xlab:"x",xunit:"m",ylab:"s",yunit:"cm",fn:x=>sg*sh*Math.cos(TAU*x/lam)}}; }
const T_TAB=[{T:0.2,tmax:0.8,mi:0.05,ma:0.1},{T:0.4,tmax:1.6,mi:0.1,ma:0.2},{T:0.5,tmax:2,mi:0.125,ma:0.25},{T:0.8,tmax:3.2,mi:0.2,ma:0.4},{T:1,tmax:4,mi:0.25,ma:0.5}];
function stConf(){ const r=one(T_TAB), sh=one([2,3,4]), sg=Math.random()<.5?1:-1;
  return {T:r.T,sh,sg,o:{xmax:r.tmax,xminor:r.mi,xmajor:r.ma,ymax:sh+1,ystep:1,xlab:"t",xunit:"s",ylab:"s",yunit:"cm",fn:t=>sg*sh*Math.cos(TAU*t/r.T)}}; }
function plotViz(confs){ return api=>{ const sts=confs.map((c,k)=>({st:canvasFill(api.cv(confs.length>1&&k>0?"":"")),c})); let shown=false;
  loop(()=>{ const col=colors(); sts.forEach(({st,c})=>axesPlot(st,col,Object.assign({},c,{shown}))); });
  return {reveal(){ shown=true; }}; }; }
function uniq(o){ const s=o.opts.map(x=>x.t); return new Set(s).size===s.length; }
function gen(fn){ for(let n=0;n<60;n++){ const o=fn(); if(uniq(o)) return o; } return fn(); }
function ablesenL1(){
  const lamQ=()=>gen(()=>{ const c=sxConf(); const m={type:"h",a:0,b:c.lam,y:c.sg*c.sh,label:"λ"};
    return {viz:plotViz([Object.assign({},c.o,{mark:m,title:"Ortsdarstellung"})]),q:"Wie groß ist die Wellenlänge λ?",
      opts:[{t:`${nf(c.lam)} m`,ok:true},{t:`${nf(c.lam/2)} m`,fb:"Das ist der Abstand Berg–Tal, also λ/2."},{t:`${nf(2*c.lam)} m`,fb:"Das sind zwei Wellenlängen. Miss bis zum direkt nächsten Berg."},{t:`${nf(c.lam/4)} m`,fb:"Das ist der Abstand Ruhelage–Berg, also λ/4."}],
      erkl:`Von einem Berg zum nächsten Berg (oder Tal zu Tal) sind es ${nf(c.lam)} m.`}; });
  const ampQ=()=>gen(()=>{ const c=sxConf(); const xc=c.sg>0?c.lam:c.lam/2; const m={type:"v",x:xc,y:c.sh,label:"ŝ"};
    return {viz:plotViz([Object.assign({},c.o,{mark:m,title:"Ortsdarstellung"})]),q:"Wie groß ist die Amplitude ŝ?",
      opts:[{t:`${nf(c.sh)} cm`,ok:true},{t:`${nf(2*c.sh)} cm`,fb:"Das ist der Abstand Berg–Tal. Die Amplitude misst man von der Ruhelage aus."},{t:`${nf(c.sh/2)} cm`,fb:"Zu klein. Miss von s = 0 bis zum Berg."},{t:`${nf(c.lam)} m`,fb:"Das ist die Wellenlänge, eine Länge in x-Richtung, keine Auslenkung."}],
      erkl:`Die Amplitude ist die größte Auslenkung aus der Ruhelage: ${nf(c.sh)} cm.`}; });
  return shuffle([lamQ(),lamQ(),lamQ(),ampQ(),ampQ()]).map(o=>mcTask(Object.assign(o,{hint:"Schau zuerst auf die Achsen."})));
}
function ablesenL2(){
  const tQ=()=>gen(()=>{ const c=stConf(); const m={type:"h",a:0,b:c.T,y:c.sg*c.sh,label:"T"};
    return {viz:plotViz([Object.assign({},c.o,{mark:m,title:"Zeitdarstellung"})]),q:"Wie groß ist die Periodendauer T?",
      opts:[{t:`${nf(c.T)} s`,ok:true},{t:`${nf(c.T/2)} s`,fb:"Das ist der Abstand Hochpunkt–Tiefpunkt, nur eine halbe Schwingung."},{t:`${nf(2*c.T)} s`,fb:"Das sind zwei volle Schwingungen."},{t:`${nf(c.T/4)} s`,fb:"Das ist nur eine Viertelschwingung."}],

      return {viz:plotViz([Object.assign({},c.o,{title:"Diagramm"})]),q:"Wie groß ist die Periodendauer T?",
        opts:[{t:"Nicht ablesbar. Dafür bräuchte ich s(t).",ok:true},{t:`${nf(c.lam)} s`,fb:"Auf der Achse steht x in m. Das ist λ, keine Zeit."},{t:`${nf(c.lam/2)} s`,fb:"Auf der Achse steht x in m, nicht t."},{t:`${nf(2*c.lam)} s`,fb:"Auf der Achse steht x in m, nicht t."}],

    const c=stConf();

      opts:[{t:"Nicht ablesbar. Dafür bräuchte ich s(x).",ok:true},{t:`${nf(c.T)} m`,fb:"Auf der Achse steht t in s. Das ist T, keine Länge."},{t:`${nf(c.T/2)} m`,fb:"Auf der Achse steht t in s, nicht x."},{t:`${nf(2*c.T)} m`,fb:"Auf der Achse steht t in s, nicht x."}],

  return shuffle([tQ(),tQ(),fQ(),fQ(),falle()]).map(o=>mcTask(Object.assign(o,{hint:"Achse zuerst: x oder t?"})));
}
function ablesenL3(){
  const pair=()=>{ for(let n=0;n<80;n++){ const a=sxConf(), b=stConf(); b.o.fn=t=>a.sg*a.sh*Math.cos(TAU*t/b.T); b.o.ymax=a.o.ymax;
      if(b.T!==1 && a.lam/b.T<=15) return {a,b}; } const a=sxConf(), b=stConf(); return {a,b}; };
  const viz=(p)=>plotViz([Object.assign({},p.a.o,{title:"Ortsdarstellung s(x) bei t = 0"}),Object.assign({},p.b.o,{title:"Zeitdarstellung s(t) bei x = 0"})]);
  const cQ=()=>gen(()=>{ const p=pair(), l=p.a.lam, T=p.b.T, c=l/T;
    return {viz:viz(p),q:"Wie groß ist die Ausbreitungsgeschwindigkeit c?",
      opts:[{t:`${nf(c)} m/s`,ok:true},{t:`${nf(l*T)} m/s`,fb:"c = λ / T, nicht λ · T."},{t:`${nf(T/l)} m/s`,fb:"Der Bruch ist umgedreht."},{t:`${nf(2*l/T)} m/s`,fb:"Du hast eine halbe Schwingung als T genommen."}],
      erkl:`Oben λ = ${nf(l)} m, unten T = ${nf(T)} s. c = λ / T = ${nf(c)} m/s.`}; });
  const zeitQ=()=>gen(()=>{ const p=pair(), l=p.a.lam, T=p.b.T, c=l/T, d=one([6,12,30]);
    return {viz:viz(p),q:`Wie lange braucht ein Wellenberg für eine Strecke von ${d} m?`,
      opts:[{t:`${nf(d/c)} s`,ok:true},{t:`${nf(d*c)} s`,fb:"Du hast mit c multipliziert. Es gilt t = Strecke / c."},{t:`${nf(d/l)} s`,fb:"Das ist die Anzahl der Wellenlängen auf der Strecke, keine Zeit."},{t:`${nf(d/(2*c))} s`,fb:"Du hast mit doppeltem c gerechnet."}],
      erkl:`Erst c = λ / T = ${nf(c)} m/s, dann t = ${d} m / c = ${nf(d/c)} s.`}; });
  const dopQ=()=>gen(()=>{ const p=pair(), l=p.a.lam;
    return {viz:viz(p),q:"Der Erreger schwingt jetzt doppelt so schnell. Das Medium bleibt. Wie groß wird λ?",

      erkl:`Oben liest du λ = ${nf(l)} m ab. Doppeltes f bei gleichem c halbiert λ: ${nf(l/2)} m.`}; });
  return shuffle([cQ(),cQ(),cQ(),zeitQ(),dopQ()]).map(o=>mcTask(Object.assign(o,{hint:"Oben x, unten t: Welches Diagramm liefert welche Größe?"})));

  querlaengs:{titel:"Quer oder längs?", art:"Wellenarten", kurz:"Wellen aus Alltag, Technik und Natur: Querwelle, Längswelle oder Mischform?",
    intro:"Du siehst eine Welle aus Alltag, Technik oder Natur. Entscheide, welche Wellenart es ist. Danach zeigt dir die Animation, wie die Teilchen wirklich schwingen.",
    levels:[{name:"Klare Fälle",info:"Seil, Feder, Schall, Stadion.",make:()=>pick(PHAENOMENE.filter(p=>p.lv===1),PRO_LEVEL).map(p=>phenTask(p,false))},
            {name:"Knifflige Fälle",info:"Erdbeben, Gitarre, Wasser, Ultraschall.",make:()=>pick(PHAENOMENE.filter(p=>p.lv===2),PRO_LEVEL).map(p=>phenTask(p,false))},
            {name:"Begründen",info:"Warum ist das so? Wähle die Erklärung, die wirklich trägt.",make:()=>pick(QL_L3,PRO_LEVEL).map(mcTask)}]},
  teilchen:{titel:"Welches Teilchen bin ich?", art:"s(x) und s(t) verbinden", kurz:"Finde das Teilchen, das genau so schwingt wie im s(t)-Diagramm.",
    intro:"Oben siehst du die Welle als Foto, unten die Schwingung eines einzelnen Teilchens. Finde das passende Teilchen. Nach dem Prüfen läuft die Animation, und du siehst, ob deine Vorhersage stimmt.",
    levels:[{name:"Welle nach rechts",info:"Die Welle läuft immer nach rechts.",make:()=>teilchenTasks(true)},
            {name:"Beide Richtungen",info:"Achte auf die Laufrichtung.",make:()=>teilchenTasks(false)},
            {name:"Umgekehrt",info:"Das Teilchen ist markiert. Welches s(t)-Diagramm gehört dazu?",make:teilchenRueck}]},
  ablesen:{titel:"Ablesen & Rechnen", art:"Diagramme lesen", kurz:"λ, ŝ, T und f aus Diagrammen ablesen und damit c berechnen.",
    intro:"Lies Größen aus s(x)- und s(t)-Diagrammen ab und rechne damit. Die falschen Antworten sind typische Ablesefehler. Schau immer zuerst auf die Achse. Nach deiner Antwort wird die richtige Strecke eingezeichnet.",
    levels:[{name:"Ortsdarstellung",info:"λ und ŝ aus s(x).",make:ablesenL1},
            {name:"Zeitdarstellung",info:"T und f aus s(t), mit einer Falle.",make:ablesenL2},
            {name:"Beide Diagramme",info:"c, Laufzeit und Vorhersage aus s(x) und s(t).",make:ablesenL3}]},
  polar:{titel:"Polarisierbar?", art:"Polarisation", kurz:"Welle trifft Spalt: Was kommt durch? Erst vorhersagen, dann zuschauen.",
    intro:"Eine Welle trifft auf einen oder mehrere Spalte. Sag voraus, was dahinter ankommt. Die Animation zeigt dir danach, ob du richtig lagst.",
    levels:[{name:"Welche Wellen?",info:"Lässt sich diese Welle überhaupt polarisieren?",make:()=>pick(PHAENOMENE.filter(p=>p.art!=="misch"&&!p.nopol),PRO_LEVEL).map(p=>phenTask(p,true))},
            {name:"Ein Spalt",info:"Senkrecht und waagerecht, Quer- und Längswelle.",make:polL2},
            {name:"Mehrere Spalte",info:"Schräge Schwingungen, gekreuzte Spalte und eine Überraschung.",make:polL3}]}
};

/* =====================================================================
   ANSICHTEN
   ===================================================================== */
let aktK = (KAPITEL.find(k=>k.freigegeben)||KAPITEL[0]).id;
const kap = ()=>KAPITEL.find(k=>k.id===aktK);
function view(fill){ cleanup(); app.className=fill?"fill":""; app.innerHTML=""; window.scrollTo(0,0); }
function bar(backLabel,onBack,eyebrow,title,right){ const b=el("div",{class:"bar"});
  const back=el("button",{class:"back"},backLabel); back.addEventListener("click",onBack);
  const ttl=el("div",{class:"ttl"},`<span class="eyebrow">${eyebrow}</span><h2>${title}</h2>`);
  b.append(back,ttl); if(right) b.appendChild(right); app.appendChild(b); return b; }

/* ---------- Lernpfad ---------- */
function stations(k){
  const nC=k.steckbriefe.length, dC=k.steckbriefe.filter(id=>P.cards[id]).length;
  const list=[{kind:"cards",titel:"Steckbriefe",eyebrow:"Start",kurz:`${nC} Karten zum Durchblättern, jede mit Mini-Check.`,open:true,done:dC===nC,prog:`${dC} / ${nC} Karten`,go:()=>renderFocus(k)}];
  k.challenges.forEach((typ,i)=>{ const id=chId(k,typ), def=CH[typ], passed=[0,1,2].map(n=>lvPassed(id,n));
    list.push({kind:"ch",typ,titel:def.titel,eyebrow:`Challenge ${i+1}`,kurz:def.kurz,open:chOpen(k,i),done:passed.every(Boolean),passed,
      lock:i===0?"Erst alle Steckbriefe mit Mini-Check schaffen.":`Erst Level 1 von „${CH[k.challenges[i-1]].titel}“ schaffen.`,go:()=>renderIntro(k,typ)}); });
  return list; }
function renderHome(){
  view(false);
  const top=el("header",{class:"top"});
  const brand=el("div",{class:"brand"});
  const logo=el("button",{class:"logo","aria-label":"Wellen-Werkstatt"},`<svg width="50" height="50" viewBox="0 0 46 46" aria-hidden="true"><rect x="1" y="1" width="44" height="44" rx="12" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M6 23 C 11 9, 16 9, 20 23 S 29 37, 33 23 S 39 13, 40 16" fill="none" stroke="var(--wave)" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="23" r="3.6" fill="var(--mark)"/></svg>`);
  let lp; logo.addEventListener("pointerdown",()=>{ clearTimeout(lp); lp=setTimeout(()=>{ teacher=!teacher; renderHome(); },900); });
  ["pointerup","pointerleave","pointercancel"].forEach(e=>logo.addEventListener(e,()=>clearTimeout(lp)));
  logo.addEventListener("contextmenu",e=>e.preventDefault());
  brand.append(logo,el("div",{},`<h1>Wellen-Werkstatt</h1><p>BPE 10 · Mechanische Wellen</p>`));
  const tabs=el("nav",{class:"tabs","aria-label":"Kapitel"});
  if(teacher){ const tb=el("button",{class:"teacher"},"Lehrkraft-Modus: alles frei ✕"); tb.addEventListener("click",()=>{ teacher=false; renderHome(); }); tabs.appendChild(tb); }
  KAPITEL.forEach(k=>{ const b=el("button",{class:"tab","aria-pressed":String(k.id===aktK)},`<span class="nr">${k.nr}</span>${k.titel}`);
    if(!k.freigegeben){ b.disabled=true; b.title="Wird später freigegeben"; } else b.addEventListener("click",()=>{ aktK=k.id; renderHome(); });
    tabs.appendChild(b); });
  tabs.appendChild(themeSwitch());
  top.append(brand,tabs); app.appendChild(top);

  const k=kap(); const home=el("main",{class:"home"});
  home.appendChild(el("div",{class:"khead"},`<span class="eyebrow">Kapitel ${k.nr} · Lernpfad</span><h2>${k.titel}</h2><p>${k.untertitel}</p>`));
  const st=stations(k); const next=st.find(s=>s.open&&!s.done);
  const note=el("p",{class:"cta-note"});
  const path=el("div",{class:"path"});
  st.forEach((s,i)=>{ if(i) path.appendChild(el("div",{class:"conn","aria-hidden":"true"},CHEVRON));
    const b=el("button",{class:"station"+(s.done?" done":"")+(!s.open?" locked":"")+(s===next?" next":"")});
    const stat=s.kind==="cards"?s.prog:`<span class="dots">${s.passed.map(p=>`<i class="${p?"on":""}"></i>`).join("")}</span>${s.passed.filter(Boolean).length} / 3 Level`;
    b.innerHTML=`${s===next?'<span class="badge-next">Als Nächstes</span>':""}<span class="num">${s.done?"✓":(s.open?i+1:LOCK)}</span><span class="eyebrow">${s.eyebrow}</span><h3>${s.titel}</h3><p>${s.kurz}</p><span class="stat">${stat}</span>`;
    if(s.open) b.addEventListener("click",s.go);
    else { b.setAttribute("aria-disabled","true"); b.addEventListener("click",()=>{ note.textContent=s.lock; note.className="cta-note warn"; }); }
    path.appendChild(b); });
  home.appendChild(path);
  const cta=el("div",{class:"cta-row"});
  if(next){ let txt;
    if(next.kind==="cards") txt="Weiter: Steckbriefe lesen →";
    else { const n=next.passed.findIndex(p=>!p); txt=`Weiter: ${next.titel} · Level ${n+1} →`; }
    const b=el("button",{class:"btn big"},txt);
    b.addEventListener("click",()=>{ if(next.kind==="cards") renderFocus(k); else { const n=next.passed.findIndex(p=>!p); lvOpen(chId(k,next.typ),n)?playLevel(k,next.typ,n):renderIntro(k,next.typ); } });
    cta.appendChild(b); }
  else cta.appendChild(el("p",{class:"prompt"},"Kapitel geschafft. Alle Levels lassen sich wiederholen."));
  cta.appendChild(note); home.appendChild(cta);
  home.appendChild(el("div",{class:"rules"},
    `<div class="rule"><b>1 · Steckbriefe</b>Karte lesen, Mini-Check lösen, weiterblättern. Danach geht die erste Challenge auf.</div>
     <div class="rule"><b>2 · Level-Hürde</b>Jedes Level hat ${PRO_LEVEL} Aufgaben. Mit ${HUERDE} Treffern im ersten Versuch steigst du auf.</div>
     <div class="rule"><b>3 · Erst denken</b>Bei jeder Animation sagst du zuerst voraus, was passiert. Dann schaust du zu.</div>`));
  const gesperrt=KAPITEL.filter(x=>!x.freigegeben);
  if(gesperrt.length) home.appendChild(el("div",{class:"locked-k"},`Nächstes Kapitel: <b>${gesperrt[0].titel}</b>. Es kommt mit der nächsten Version der App.`));
  app.appendChild(home);
  const ft=el("footer",{},`<span>Wellen-Werkstatt · Version 2.1 · Stand 06.11.2026</span>`);
  const rs=el("button",{class:"linkbtn"},"Fortschritt zurücksetzen"); let armT;
  rs.addEventListener("click",()=>{ if(rs.classList.contains("arm")){ P={cards:{},lv:{},best:{}}; save(); renderHome(); return; }
    rs.classList.add("arm"); rs.textContent="Wirklich? Nochmal tippen"; clearTimeout(armT); armT=setTimeout(()=>{ rs.classList.remove("arm"); rs.textContent="Fortschritt zurücksetzen"; },3000); });
  ft.appendChild(rs); app.appendChild(ft);
}

/* ---------- Fokus-Ansicht: Steckbriefe ---------- */
function renderFocus(k,start){
  view(true);
  const ids=k.steckbriefe; let i=start!==undefined?start:ids.findIndex(id=>!P.cards[id]); if(i<0) i=0;
  const counter=el("span",{class:"score"});
  bar("← Lernpfad",renderHome,`Kapitel ${k.nr} · Steckbriefe`,"Steckbriefe",counter).appendChild(themeSwitch());
  const stage=el("div",{class:"fstage"}); app.appendChild(stage);
  const nav=el("div",{class:"fnav"}); app.appendChild(nav);
  const prev=el("button",{class:"btn ghost"},"← Zurück"), next=el("button",{class:"btn"},"Weiter →");
  const mid=el("div",{class:"fmid"}); const dots=el("div",{class:"fdots"}); const fh=el("div",{class:"fhint"}); mid.append(dots,fh);
  nav.append(prev,mid,next);
  const reach=n=>teacher||n<=Math.max(0,ids.findIndex(id=>!P.cards[id])===-1?ids.length-1:ids.findIndex(id=>!P.cards[id]));
  const canNext=()=>teacher||P.cards[ids[i]];
  function updNav(){
    counter.textContent=`Karte ${i+1} / ${ids.length}`;
    prev.disabled=i===0;
    const last=i===ids.length-1;
    next.textContent=last?(cardsDone(k)?"Zur ersten Challenge →":"Fertig →"):"Weiter →";
    next.disabled=!canNext();
    fh.textContent=canNext()?(last&&!cardsDone(k)?"Es fehlen noch Mini-Checks.":"Wischen oder tippen"):"Erst den Mini-Check lösen";
    dots.innerHTML=""; ids.forEach((id,n)=>{ const d=el("button",{class:(P.cards[id]?"done ":"")+(n===i?"cur":""),"aria-label":`Karte ${n+1}`}); d.addEventListener("click",()=>{ if(n!==i && reach(n)) show(n,n>i?1:-1); }); dots.appendChild(d); });
  }
  function go(d){ if(d<0){ if(i>0) show(i-1,-1); return; }
    if(!canNext()) return;
    if(i<ids.length-1) show(i+1,1);
    else if(cardsDone(k)||teacher) renderIntro(k,k.challenges[0]);
    else show(ids.findIndex(id=>!P.cards[id]),-1); }
  prev.addEventListener("click",()=>go(-1)); next.addEventListener("click",()=>go(1));
  function show(n,dir){
    cleanup(); i=n; stage.innerHTML=""; const id=ids[i], sb=STECKBRIEFE[id];
    const card=el("article",{class:"fcard"+(dir?(dir>0?" inR":" inL"):"")});
    const tx=el("div",{class:"ftext"}); tx.appendChild(el("span",{class:"eyebrow"},`Steckbrief ${i+1}`)); tx.appendChild(el("h3",{},sb.titel));
    if(sb.formel) tx.appendChild(el("div",{class:"formel"},sb.formel));
    tx.appendChild(el("p",{},sb.text));
    if(sb.merke) tx.appendChild(el("p",{class:"merke"},`<span class="tag">Merke</span><br>${sb.merke}`));
    if(sb.falle) tx.appendChild(el("p",{class:"falle"},`<span class="tag">Typische Falle</span><br>${sb.falle}`));
    const side=el("div",{class:"fside"}); card.append(tx,side); stage.appendChild(card);
    if(sb.viz && VIZ[sb.viz]) VIZ[sb.viz](side);
    side.appendChild(checkBox(id,sb,updNav));
    let sx=null, sy=null;
    card.addEventListener("pointerdown",e=>{ sx=e.clientX; sy=e.clientY; });
    card.addEventListener("pointerup",e=>{ if(sx===null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null; if(Math.abs(dx)>70&&Math.abs(dy)<60) go(dx<0?1:-1); });
    updNav();
  }
  show(i,0);
}
function checkBox(id,sb,onChange){ const c=sb.check; const box=el("div",{class:"check"+(P.cards[id]?" solved":"")});
  box.innerHTML=`<span class="eyebrow">${P.cards[id]?"Mini-Check · schon gelöst ✓":"Mini-Check"}</span><p class="q">${c.q}</p>`;
  const opts=el("div",{class:"opts"}), fb=el("div",{}); let fertig=false;
  shuffle(c.o.map((t,j)=>({t,ok:j===0}))).forEach(o=>{ const b=el("button",{},o.t);
    b.addEventListener("click",()=>{ if(fertig||b.classList.contains("wrong")) return;
      if(o.ok){ fertig=true; b.classList.add("right"); box.classList.add("solved"); fb.innerHTML=`<div class="feedback ok"><b>${one(LOBW)}</b>${c.e}</div>`; P.cards[id]=true; save(); onChange(); }
      else { b.classList.add("wrong"); fb.innerHTML=`<div class="feedback bad"><b>Nicht ganz. Versuch es nochmal.</b>${c.h}</div>`; } });
    opts.appendChild(b); });
  box.append(opts,fb); return box; }

/* ---------- Challenge: Level-Auswahl ---------- */
function renderIntro(k,typ){
  view(true);
  const def=CH[typ], id=chId(k,typ), idx=k.challenges.indexOf(typ);
  bar("← Lernpfad",renderHome,`Kapitel ${k.nr} · Challenge ${idx+1} von ${k.challenges.length}`,def.titel,themeSwitch());
  const wrap=el("div",{class:"intro"});
  wrap.appendChild(el("div",{class:"about"},`<span class="eyebrow">${def.art}</span><h3>So geht's</h3><p>${def.intro}</p>
    <div class="rule"><b>Level-Hürde</b>${PRO_LEVEL} Aufgaben pro Level. Mit ${HUERDE} Treffern im ersten Versuch steigst du auf. ${idx<k.challenges.length-1?"Level 1 schaltet die nächste Challenge frei.":""}</div>`));
  const lvls=el("div",{class:"levels"}); const nextLv=[0,1,2].find(n=>lvOpen(id,n)&&!lvPassed(id,n));
  def.levels.forEach((lv,n)=>{ const open=lvOpen(id,n), passed=lvPassed(id,n), best=P.best[id+":"+n];
    const b=el("button",{class:"level"+(passed?" passed":"")+(!open?" locked":"")+(n===nextLv?" next":"")});
    b.innerHTML=`<span class="lnum">${passed?"✓":n+1}</span><span><span class="eyebrow">Level ${n+1}${best!==undefined?` · Bestwert ${best} / ${PRO_LEVEL}`:""}</span><h3>${lv.name}</h3><p>${lv.info}</p></span><span class="go">${!open?LOCK:(passed?"Nochmal →":"Start →")}</span>`;
    if(open) b.addEventListener("click",()=>playLevel(k,typ,n));
    lvls.appendChild(b); });
  wrap.appendChild(lvls); app.appendChild(wrap);
}

/* ---------- Level spielen ---------- */
function playLevel(k,typ,n){
  view(true);
  const def=CH[typ], lv=def.levels[n], id=chId(k,typ);
  const tasks=lv.make(); const N=tasks.length; const res=[]; let i=0;
  const track=el("div",{class:"track","aria-label":"Fortschritt im Level"});
  bar("← Level",()=>renderIntro(k,typ),def.titel,`Level ${n+1} · ${lv.name}`,track);
  const split=el("div",{class:"split"}); const viz=el("section",{class:"viz"}); const panel=el("section",{class:"panel"}); split.append(viz,panel); app.appendChild(split);
  function drawTrack(){ const fehler=res.filter(x=>x===false).length, erlaubt=N-HUERDE;
    track.innerHTML=[...Array(N)].map((_,q)=>`<i class="${res[q]===true?"ok":res[q]===false?"bad":""}${q===i&&res[q]===undefined?" cur":""}"></i>`).join("");
    const txt=fehler<erlaubt?`Ziel ${HUERDE} / ${N} · noch ${erlaubt-fehler} Fehler frei`:fehler===erlaubt?`Ziel ${HUERDE} / ${N} · kein Fehler mehr frei`:"Hürde verpasst · spiel zu Ende";
    track.appendChild(el("span",{class:fehler>=erlaubt?"warn":""},txt)); }
  function run(){
    cleanup(); viz.innerHTML=""; panel.innerHTML=""; panel.scrollTop=0; drawTrack();
    const eb=el("div",{class:"ptop"},`<span class="eyebrow">Aufgabe ${i+1} von ${N}</span>`);
    const pr=el("p",{class:"prompt"}), hints=el("div",{class:"pbody"}), body=el("div",{class:"pbody"}), fb=el("div",{}), acts=el("div",{class:"actions"});
    panel.append(eb,pr,hints,body,fb,acts);
    const api={viz,panel,body,actions:acts,
      prompt:t=>{ pr.innerHTML=t; }, hint:t=>{ hints.appendChild(el("p",{class:"hint"},t)); },
      badge:t=>{ eb.appendChild(el("span",{class:"pred"},t)); },
      cv:(cls="")=>mkcv(viz,cls),
      legend:html=>{ const l=el("div",{class:"legend"},html); viz.appendChild(l); return l; },
      situation:t=>{ viz.appendChild(el("div",{class:"situ"},`<span class="eyebrow">Situation</span><p>${t}</p>`)); },
      feedback:(ok,html,title)=>{ fb.innerHTML=`<div class="feedback ${ok?"ok":"bad"}"><b>${title||(ok?one(LOBW):"Nicht ganz.")}</b>${html}</div>`; },
      finish:ok=>{ if(res[i]!==undefined) return; res[i]=!!ok; drawTrack(); acts.innerHTML="";
        const w=el("button",{class:"btn"},i+1<N?"Weiter →":"Auswertung →"); w.addEventListener("click",()=>{ i++; i<N?run():ende(); }); acts.appendChild(w);
        requestAnimationFrame(()=>{ try{ panel.scrollTo({top:panel.scrollHeight,behavior:"smooth"}); }catch(e){} }); }};
    tasks[i].run(api);
  }
  function ende(){
    cleanup(); split.remove();
    const hits=res.filter(Boolean).length, pass=hits>=HUERDE, war=lvPassed(id,n);
    const idx=k.challenges.indexOf(typ), nextTyp=k.challenges[idx+1];
    if(pass){ P.lv[id]=P.lv[id]||[false,false,false]; P.lv[id][n]=true; }
    P.best[id+":"+n]=Math.max(P.best[id+":"+n]||0,hits); save(); drawTrack(); const sp=track.querySelector("span"); if(sp){ sp.textContent=pass?"Level geschafft":"Hürde verpasst"; sp.className=pass?"":"warn"; }
    const card=el("div",{class:"endcard"});
    card.innerHTML=`<span class="eyebrow">Level ${n+1} · ${lv.name}</span><span class="big">${hits} / ${N}</span><span class="muted">Treffer im ersten Versuch</span>`;
    card.appendChild(el("h3",{},pass?(hits===N?"Perfekt. Level geschafft!":"Level geschafft!"):(hits===HUERDE-1?"Knapp daneben.":"Noch nicht geschafft.")));
    card.appendChild(el("p",{class:"msg"},pass?(hits===N?"Alles im ersten Versuch. Du hast die Zusammenhänge im Griff.":"Schau dir den Fehler im Steckbrief noch einmal an."):`Für den Aufstieg brauchst du ${HUERDE} von ${N}. Die nächste Runde hat neue Aufgaben.`));
    if(pass&&!war){ if(n<2) card.appendChild(el("span",{class:"unlock"},`Level ${n+2} ist frei.`));
      if(n===0&&nextTyp) card.appendChild(el("span",{class:"unlock"},`Neue Challenge frei: ${CH[nextTyp].titel}`)); }
    const acts=el("div",{class:"actions",style:"justify-content:center;margin-top:8px"});
    const btn=(t,fn,ghost)=>{ const b=el("button",{class:"btn"+(ghost?" ghost":"")},t); b.addEventListener("click",fn); acts.appendChild(b); };
    if(pass){ if(n<2) btn(`Level ${n+2} starten →`,()=>playLevel(k,typ,n+1)); else if(nextTyp) btn(`Weiter: ${CH[nextTyp].titel} →`,()=>renderIntro(k,nextTyp));
      if(n===0&&nextTyp) btn(`${CH[nextTyp].titel} →`,()=>renderIntro(k,nextTyp),true); }
    else { btn("Neue Runde",()=>playLevel(k,typ,n)); btn("Steckbriefe ansehen",()=>renderFocus(k,0),true); }
    btn("Zum Lernpfad",renderHome,true);
    card.appendChild(acts); app.appendChild(card);
  }
  run();
}

renderHome();
</script>
